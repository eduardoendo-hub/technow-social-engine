server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # /api/* e /admin/* nao existem nesta LP — 404 + noindex
    location /api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 404;
    }
    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 404;
    }

    # Raiz serve index.html. Outros paths: arquivo real OU 404 (em vez de
    # fallback pra index.html, que poluia o indice do Google com URLs falsas)
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache curto pra arquivos SEO-criticos (Google ve versao fresca)
    location = /sitemap.xml   { add_header Cache-Control "public, max-age=300" always; }
    location = /robots.txt    { add_header Cache-Control "public, max-age=300" always; }
    location = /llms.txt      { add_header Cache-Control "public, max-age=300" always; }
    location = /llms-full.txt { add_header Cache-Control "public, max-age=300" always; }

    gzip on;
    gzip_types text/html text/css text/plain text/xml application/javascript image/svg+xml application/json;
}

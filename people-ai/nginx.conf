server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/* nao deveria existir nesta LP (integracao vive em rd.technowhub.ai)
    location /api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 404;
    }
    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 404;
    }

    # Raiz serve index.html. Outros paths: arquivo real OU 404 (nao mais
    # fallback pra index.html — evita Google indexar /qualquer-coisa como
    # duplicata da home).
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache curto pra arquivos SEO-criticos
    location = /sitemap.xml   { add_header Cache-Control "public, max-age=300" always; }
    location = /robots.txt    { add_header Cache-Control "public, max-age=300" always; }
    location = /llms.txt      { add_header Cache-Control "public, max-age=300" always; }
    location = /llms-full.txt { add_header Cache-Control "public, max-age=300" always; }

    gzip on;
    gzip_types text/html text/css text/plain text/xml application/javascript image/svg+xml application/json;
}
